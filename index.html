<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">

<!-- ===== ANTI-CACHÉ (para que el celular siempre pida la versión nueva) ===== -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>Ventana hacia mi mente (con glow)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#050505; --fg:#ffffff; --dim:#777; --glow: rgba(255,255,255,.55); }
  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{margin:0; min-height:100svh; color:var(--fg); font-family:"IBM Plex Mono",monospace;
    background:var(--bg);
    padding:max(3.4rem,env(safe-area-inset-top)) 1.1rem max(3rem,env(safe-area-inset-bottom));
  }
  .vignette{position:fixed; inset:0; pointer-events:none; z-index:2;
    background:radial-gradient(ellipse 75% 65% at 50% 45%, transparent 60%, rgba(0,0,0,.65) 100%);
  }
  .composition{width:min(100%,38rem); margin:0 auto; position:relative; z-index:1}
  .prompt{color:var(--dim); font-size:clamp(.82rem,3.2vw,.95rem); margin:0 0 1.6rem; letter-spacing:.01em}
  .prompt .path{color:var(--fg)}
  #output{font-size:clamp(.95rem,3.7vw,1.12rem); line-height:1.75; white-space:pre-wrap; text-shadow:0 0 9px var(--glow); min-height:14rem}
  #output p{margin:0 0 1.3em}
  #output p:last-child{margin-bottom:0}
  .signature{color:#fff}
  .sigdash{color:var(--dim)}
  .cursor{display:inline-block; width:.55em; height:1.05em; background:var(--fg); vertical-align:text-bottom; margin-left:2px; animation:blink 1s steps(1) infinite}
  .comment{color:var(--dim); font-size:.78rem; margin-top:2.4rem; letter-spacing:.02em}
  .comment::before{content:"# "}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){ .cursor{animation:none} }
</style>
</head>
<body>
  <div class="vignette" aria-hidden="true"></div>

  <div class="composition">
    <div id="output" aria-live="polite"></div>







    <!-- FECHA: CAMBIA EL TEXTO DE ABAJO -->
    <p class="comment">act. 22 sep 2026 · 6:39 a.m.</p>
  </div>







  <!-- PLANTILLA DEL TEXTO: CAMBIA AQUÍ. USA UN <p> POR CADA PÁRRAFO. NO TOQUES LA FIRMA -->
  <template id="letter-source">
    <p>No a rendirme al sueño.</p>
    <p>Si a ayudar a compañeros.</p>
    <p>No a arreglarme rapido.</p>
    <p>Si a acabarme mi arepa.</p>

    
    <p class="sigdash">--</p>
    <p class="signature">Juandi</p>
  </template>










  <script>
    const tpl = document.getElementById('letter-source');
    const out = document.getElementById('output');
    const paras = Array.from(tpl.content.querySelectorAll('p'));
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function renderInstant(){
      paras.forEach(p => {
        const el = document.createElement('p');
        el.className = p.className;
        el.textContent = p.textContent;
        out.appendChild(el);
      });
      const c = document.createElement('span');
      c.className = 'cursor';
      out.appendChild(c);
    }

    async function typeParas(){
      for (const p of paras){
        const el = document.createElement('p');
        el.className = p.className;
        out.appendChild(el);
        const text = p.textContent;
        for (let i=0;i<text.length;i++){
          el.textContent += text[i];
          await new Promise(r => setTimeout(r, 14 + Math.random()*20));
        }
        await new Promise(r => setTimeout(r, 220));
      }
      const c = document.createElement('span');
      c.className = 'cursor';
      out.appendChild(c);
    }

    if (reduced) { renderInstant(); } else { typeParas(); }
  </script>
</body>
</html>
